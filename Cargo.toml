[package]
name = "wist-contracts"
version = "0.1.2" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["wist Dev Team"]
description = "Versioned contract and schema objects shared by the wist edge and center components"
repository = "https://github.com/dayu-sec/wist-contracts"
homepage = "https://github.com/dayu-sec/wist-contracts"
documentation = "https://docs.rs/wist-contracts"
readme = "README.md"
keywords = ["wist", "contracts", "schema", "agent", "telemetry"]
categories = ["data-structures", "config", "network-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
jumo-derive = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
